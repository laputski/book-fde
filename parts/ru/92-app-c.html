  <h2 id="s-c"><span class="num">C</span>Глоссарий</h2>

<p>Глоссарий собирается из определений, данных в главах, при открытии книги: у каждого термина указано, где он введён. Вручную он не пишется и потому не может разойтись с главами.</p>
